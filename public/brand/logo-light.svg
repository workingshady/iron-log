<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Iron Log">
  <!-- Horizontal logo: app icon + wordmark. Text uses the system UI font stack (same as the app). -->
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1f17"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient></defs>
  <g transform="translate(20 20)">
    <rect width="260" height="260" rx="57" fill="url(#bg)"/>
    <g transform="translate(130 130) scale(.52) translate(-256 -256) rotate(-20 256 256)" fill="#c8f560">
      <rect x="70" y="214" width="34" height="84" rx="10" opacity=".55"/>
      <rect x="112" y="178" width="44" height="156" rx="12"/>
      <rect x="150" y="238" width="212" height="36" rx="10"/>
      <rect x="356" y="160" width="48" height="192" rx="13"/>
      <rect x="410" y="196" width="36" height="120" rx="10" opacity=".55"/>
    </g>
  </g>
  <text x="330" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="132" font-weight="800" letter-spacing="-4" fill="#111113">IRON<tspan fill="#5a8a0c"> LOG</tspan></text>
  <text x="336" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" letter-spacing="6" fill="#55555e">TRAIN · LOG · PROGRESS</text>
</svg>
